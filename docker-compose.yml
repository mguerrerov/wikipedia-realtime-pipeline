# Entorno local completo de la fase 1: cola, topico, consola y productor.
# Todas las versiones fijadas. Ver docs/versiones.md.

services:

  redpanda:
    image: redpandadata/redpanda:v25.3.16
    container_name: redpanda
    command:
      - redpanda
      - start
      # Un nodo, un core: es un portatil, no un cluster.
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --mode=dev-container
      # Dos puertos a proposito. Los contenedores entran por 9092 usando el
      # nombre del servicio; el equipo anfitrion entra por 19092 con localhost.
      # Sin esa distincion, el cliente de fuera recibe una direccion que no
      # sabe resolver, y falla despues de conectar, que es lo que despista.
      - --kafka-addr=interna://0.0.0.0:9092,externa://0.0.0.0:19092
      - --advertise-kafka-addr=interna://redpanda:9092,externa://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
      - "9644:9644"     # metricas y API de administracion
    volumes:
      - datos-redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Servicio de un solo uso: crea el topico y termina. Tenerlo aqui evita el
  # paso manual que siempre se olvida al levantar el entorno en otra maquina.
  crear-topico:
    image: redpandadata/redpanda:v25.3.16
    container_name: crear-topico
    depends_on:
      redpanda:
        condition: service_healthy
    # Un solo argumento en una linea: con el bloque plegado de YAML (>) las
    # lineas mas indentadas conservan el salto de linea y sh las ejecuta como
    # comandos sueltos.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "rpk topic create ${KAFKA_TOPICO:-wikimedia.cambios} --brokers redpanda:9092 --partitions 3 --replicas 1 || echo 'el topico ya existe, nada que hacer'"
    restart: "no"

  consola:
    image: redpandadata/console:v2.8.16
    container_name: consola-redpanda
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    restart: unless-stopped

  productor:
    build: .
    container_name: productor
    depends_on:
      redpanda:
        condition: service_healthy
      crear-topico:
        condition: service_completed_successfully
    environment:
      # Unica variable que decide el entorno en todo el proyecto.
      FUENTE_EVENTOS: kafka
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPICO: ${KAFKA_TOPICO:-wikimedia.cambios}
      LIMITE_EVENTOS: ${LIMITE_EVENTOS:-0}
    restart: unless-stopped
    # Margen para que el productor vacie su buffer al parar, en vez de morir
    # con eventos dentro.
    stop_grace_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"     # consola web de MinIO
    volumes:
      - datos-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Igual que el topico: el bucket se crea aqui para que levantar el entorno en
  # otra maquina no dependa de acordarse de un paso manual.
  crear-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: crear-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin} && mc mb --ignore-existing local/${BUCKET:-almacen} && mc ls local"
    restart: "no"

  # El job de Bronze. No se arranca solo: se lanza a mano con
  #   docker compose run --rm bronce
  # Un job de streaming que arranca con el entorno es un job que se queda
  # corriendo sin que nadie se de cuenta.
  bronce:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: pipeline-spark:3.5.6-java17
    profiles: ["jobs"]
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      crear-bucket:
        condition: service_completed_successfully
    environment: &entorno-spark
      FUENTE_EVENTOS: kafka
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPICO: ${KAFKA_TOPICO:-wikimedia.cambios}
      CATALOGO: hadoop
      S3_ENDPOINT: http://minio:9000
      ALMACEN: s3a://${BUCKET:-almacen}/warehouse
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --driver-memory 2g
      /app/src/jobs/bronce.py --duracion ${DURACION_JOB:-0}

  plata:
    image: pipeline-spark:3.5.6-java17
    profiles: ["jobs"]
    depends_on:
      minio:
        condition: service_healthy
    environment: *entorno-spark
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --driver-memory 2g
      /app/src/jobs/plata.py --duracion ${DURACION_JOB:-0}

  oro:
    image: pipeline-spark:3.5.6-java17
    profiles: ["jobs"]
    depends_on:
      minio:
        condition: service_healthy
    environment: *entorno-spark
    command: >
      /opt/spark/bin/spark-submit
      --master local[6]
      --driver-memory 3g
      /app/src/jobs/oro.py --duracion ${DURACION_JOB:-0}

  # Generador sintetico: la unica forma de provocar retrasos y duplicados, que
  # la fuente real no produce. Se lanza a mano con los parametros del ensayo.
  generador:
    build: .
    profiles: ["jobs"]
    depends_on:
      redpanda:
        condition: service_healthy
      crear-topico:
        condition: service_completed_successfully
    environment:
      FUENTE_EVENTOS: kafka
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPICO: ${KAFKA_TOPICO:-wikimedia.cambios}
    command: ["python", "-m", "src.generador"]

  consultas:
    image: pipeline-spark:3.5.6-java17
    profiles: ["jobs"]
    depends_on:
      minio:
        condition: service_healthy
    environment: *entorno-spark
    command: >
      /opt/spark/bin/spark-submit
      --master local[4]
      --driver-memory 2g
      /app/src/jobs/consultas.py

  tardios:
    image: pipeline-spark:3.5.6-java17
    profiles: ["jobs"]
    depends_on:
      minio:
        condition: service_healthy
    environment: *entorno-spark
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --driver-memory 2g
      /app/src/jobs/analiza_tardios.py

  # Consumo de la fase 4: las mismas tablas, leidas por DuckDB en vez de Spark.
  #   docker compose run --rm consumo
  consumo:
    build:
      context: .
      dockerfile: Dockerfile.duckdb
    image: pipeline-duckdb:1.5.5
    profiles: ["jobs"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CATALOGO: hadoop
      S3_ENDPOINT: http://minio:9000
      ALMACEN: s3a://${BUCKET:-almacen}/warehouse
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    command: ["python", "-m", "src.consumo_duckdb"]

  # Comprueba que Bronze no perdio ni duplico. Se lanza a mano:
  #   docker compose run --rm verifica
  verifica:
    image: pipeline-spark:3.5.6-java17
    profiles: ["jobs"]
    depends_on:
      minio:
        condition: service_healthy
    environment: *entorno-spark
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --driver-memory 2g
      /app/src/jobs/verifica_bronce.py

volumes:
  datos-redpanda:
  datos-minio:
